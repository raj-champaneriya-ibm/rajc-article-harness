# Compiles every agentic workflow (.github/workflows/*.md) and checks the spike's inference
# route in the generated lock (H0), so you can verify it from your phone. Lock files are
# uploaded as an artifact. GITHUB_TOKEN cannot push workflow files, so commit the reviewed
# lock from a laptop: `gh aw compile spike-pi-glm --approve && git push`.
name: Agentic workflow compile check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/aw-compile-check.yml"
      - "scripts/check-lock-route.sh"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install gh-aw
        run: gh extension install github/gh-aw --pin v1.2.3
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile
        run: gh aw compile
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check the spike's inference route (H0)
        run: scripts/check-lock-route.sh .github/workflows/spike-pi-glm.lock.yml

      - name: Upload lock files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-lock-files
          path: .github/workflows/*.lock.yml
          if-no-files-found: error
